name: Ship
run-name: "Ship ${{ inputs.repo }} [${{ inputs.platforms }}] ${{ inputs.version }}"

# Tetikleyenler: `ship <repo>` CLI'ı, Masaüstü Uygulaması veya proje reposundaki ship-on-tag.yml (v* tag push)
on:
  workflow_dispatch:
    inputs:
      repo:
        description: owner/repo
        required: true
        type: string
      ref:
        description: branch / tag / sha (boş = default branch)
        type: string
        default: ""
      platforms:
        type: choice
        options: [both, ios, android]
        default: both
      app_path:
        description: Repo içindeki uygulama klasörü (boş = otomatik bul)
        type: string
        default: ""
      version:
        description: Görünen sürüm, ör. 1.2.0 (boş = projede yazan)
        type: string
        default: ""
      android_track:
        type: string
        default: internal
      android_status:
        type: choice
        options: [completed, draft]
        default: completed
      apple_profile:
        description: Apple hesap profili (boş = varsayılan)
        type: string
        default: ""
      google_profile:
        description: Google Play hesap profili (boş = varsayılan)
        type: string
        default: ""

concurrency:
  group: ship-${{ inputs.repo }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      app_dir: ${{ steps.d.outputs.app_dir }}
      type: ${{ steps.d.outputs.type }}
      pm: ${{ steps.d.outputs.pm }}
      node_version: ${{ steps.d.outputs.node_version }}
      java_version: ${{ steps.d.outputs.java_version }}
      android_dir: ${{ steps.d.outputs.android_dir }}
      ios_dir: ${{ steps.d.outputs.ios_dir }}
      has_android: ${{ steps.d.outputs.has_android }}
      has_ios: ${{ steps.d.outputs.has_ios }}
      ios_scheme: ${{ steps.d.outputs.ios_scheme }}
      android_task: ${{ steps.d.outputs.android_task }}
      prepare_cmd: ${{ steps.d.outputs.prepare_cmd }}
      build_number: ${{ steps.d.outputs.build_number }}
      slug: ${{ steps.d.outputs.slug }}
      npm_lock: ${{ steps.d.outputs.npm_lock }}
    steps:
      - uses: actions/checkout@v4
        with: { path: shipper, fetch-depth: 1 }
      - name: Normalize script line endings (Desktop sync writes CRLF)
        run: for f in shipper/scripts/*.sh shipper/scripts/*.cjs; do [ -f "$f" ] && tr -d '\r' < "$f" > "$f.tmp" && cat "$f.tmp" > "$f" && rm -f "$f.tmp"; done; true
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app
          fetch-depth: 1
      - id: d
        env:
          REPO: ${{ inputs.repo }}
        run: bash shipper/scripts/detect.sh app "${{ inputs.app_path }}"

  android:
    name: Android → Google Play
    needs: detect
    if: inputs.platforms != 'ios' && needs.detect.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      COCOAPODS_DISABLE_STATS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI: "true"
      SHIPPER: ${{ github.workspace }}/shipper
      TYPE: ${{ needs.detect.outputs.type }}
      PM: ${{ needs.detect.outputs.pm }}
      SLUG: ${{ needs.detect.outputs.slug }}
      GOOGLE_PROFILE: ${{ inputs.google_profile }}
      APP_DIR: ${{ github.workspace }}/app/${{ needs.detect.outputs.app_dir }}
      ANDROID_DIR: ${{ github.workspace }}/app/${{ needs.detect.outputs.app_dir }}/${{ needs.detect.outputs.android_dir }}
      PREPARE_CMD: ${{ needs.detect.outputs.prepare_cmd }}
      GRADLE_TASK: ${{ needs.detect.outputs.android_task }}
      BUILD_NUMBER: ${{ needs.detect.outputs.build_number }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Gizli anahtarlar tam mı? (build'den ÖNCE kontrol)
        env:
          PLAY: ${{ inputs.google_profile != '' && secrets[format('PLAY_SERVICE_ACCOUNT_JSON_{0}', inputs.google_profile)] || secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KS: ${{ inputs.google_profile != '' && secrets[format('ANDROID_KEYSTORE_BASE64_{0}', inputs.google_profile)] || secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_APP: ${{ secrets[format('ANDROID_KEYSTORE_BASE64_{0}', needs.detect.outputs.slug)] }}
        run: |
          fail=0
          if [ -z "$PLAY" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret'ı yok → masaüstü uygulamasından veya terminalden Google Play hesabını ekleyin"; fail=1
          elif ! jq -e '.client_email and .private_key' >/dev/null 2>&1 <<<"$PLAY"; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON geçerli bir service account anahtarı değil (client_email/private_key yok)"; fail=1; fi
          if [ -z "$KS$KS_APP" ]; then echo "::error::Android keystore secret'ı yok → masaüstü uygulamasından veya 'ship setup' ile ekleyin"; fail=1; fi
          exit $fail
      - uses: actions/checkout@v4
        with: { path: shipper, fetch-depth: 1 }
      - name: Normalize script line endings (Desktop sync writes CRLF)
        run: for f in shipper/scripts/*.sh shipper/scripts/*.cjs; do [ -f "$f" ] && tr -d '\r' < "$f" > "$f.tmp" && cat "$f.tmp" > "$f" && rm -f "$f.tmp"; done; true
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.node_version != ''
        with:
          node-version: "${{ needs.detect.outputs.node_version }}"
          cache: ${{ needs.detect.outputs.npm_lock != '' && 'npm' || '' }}
          cache-dependency-path: ${{ needs.detect.outputs.npm_lock }}
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ needs.detect.outputs.java_version }}" }

      # Turbo Android Önbelleği (Gradle caches + wrapper + CMake/.cxx + build cache)
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Android derleme önbelleği (Turbo Cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/build-cache
            app/**/.cxx
            app/**/android/.gradle
          key: android-turbo-${{ runner.os }}-${{ inputs.repo }}-${{ hashFiles('app/**/build.gradle*', 'app/**/gradle-wrapper.properties', 'app/**/package-lock.json', 'app/**/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            android-turbo-${{ runner.os }}-${{ inputs.repo }}-${{ hashFiles('app/**/build.gradle*', 'app/**/gradle-wrapper.properties', 'app/**/package-lock.json', 'app/**/pubspec.lock') }}-
            android-turbo-${{ runner.os }}-${{ inputs.repo }}-

      - uses: subosito/flutter-action@v2
        if: needs.detect.outputs.type == 'flutter'
        with: { channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: shipper }

      - name: Prepare
        env:
          ENV_CONTENT: ${{ secrets[format('ENV_{0}', needs.detect.outputs.slug)] }}
        run: bash "$SHIPPER/scripts/prepare.sh" android

      - name: Signing + version
        env:
          KS_B64_APP: ${{ secrets[format('ANDROID_KEYSTORE_BASE64_{0}', needs.detect.outputs.slug)] }}
          KS_PASS_APP: ${{ secrets[format('ANDROID_KEYSTORE_PASSWORD_{0}', needs.detect.outputs.slug)] }}
          KS_ALIAS_APP: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', needs.detect.outputs.slug)] }}
          KEY_PASS_APP: ${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', needs.detect.outputs.slug)] }}
          KS_B64_PROF: ${{ inputs.google_profile != '' && secrets[format('ANDROID_KEYSTORE_BASE64_{0}', inputs.google_profile)] || '' }}
          KS_PASS_PROF: ${{ inputs.google_profile != '' && secrets[format('ANDROID_KEYSTORE_PASSWORD_{0}', inputs.google_profile)] || '' }}
          KS_ALIAS_PROF: ${{ inputs.google_profile != '' && secrets[format('ANDROID_KEY_ALIAS_{0}', inputs.google_profile)] || '' }}
          KEY_PASS_PROF: ${{ inputs.google_profile != '' && secrets[format('ANDROID_KEY_PASSWORD_{0}', inputs.google_profile)] || '' }}
          KS_B64_DEF: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_DEF: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS_DEF: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS_DEF: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash "$SHIPPER/scripts/android-signing.sh"

      - name: Build AAB
        run: bash "$SHIPPER/scripts/android-build.sh"

      - name: Google Play'e gönder
        working-directory: shipper
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.google_profile != '' && secrets[format('PLAY_SERVICE_ACCOUNT_JSON_{0}', inputs.google_profile)] || secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.android_track }}
          STATUS: ${{ inputs.android_status }}
        run: bundle exec fastlane android ship

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-aab
          path: ${{ env.AAB }}
          if-no-files-found: ignore

  ios:
    name: iOS → TestFlight
    needs: detect
    if: inputs.platforms != 'android' && needs.detect.outputs.has_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      COCOAPODS_DISABLE_STATS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      CI: "true"
      SHIPPER: ${{ github.workspace }}/shipper
      TYPE: ${{ needs.detect.outputs.type }}
      PM: ${{ needs.detect.outputs.pm }}
      SLUG: ${{ needs.detect.outputs.slug }}
      APPLE_PROFILE: ${{ inputs.apple_profile }}
      APP_DIR: ${{ github.workspace }}/app/${{ needs.detect.outputs.app_dir }}
      IOS_DIR: ${{ github.workspace }}/app/${{ needs.detect.outputs.app_dir }}/${{ needs.detect.outputs.ios_dir }}
      IOS_SCHEME: ${{ needs.detect.outputs.ios_scheme }}
      PREPARE_CMD: ${{ needs.detect.outputs.prepare_cmd }}
      BUILD_NUMBER: ${{ needs.detect.outputs.build_number }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { path: shipper, fetch-depth: 1 }
      - name: Normalize script line endings (Desktop sync writes CRLF)
        run: for f in shipper/scripts/*.sh shipper/scripts/*.cjs; do [ -f "$f" ] && tr -d '\r' < "$f" > "$f.tmp" && cat "$f.tmp" > "$f" && rm -f "$f.tmp"; done; true
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app
          fetch-depth: 1
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.node_version != ''
        with:
          node-version: "${{ needs.detect.outputs.node_version }}"
          cache: ${{ needs.detect.outputs.npm_lock != '' && 'npm' || '' }}
          cache-dependency-path: ${{ needs.detect.outputs.npm_lock }}
      - uses: subosito/flutter-action@v2
        if: needs.detect.outputs.type == 'flutter'
        with: { channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3", bundler-cache: true, working-directory: shipper }

      # SwiftPM + CocoaPods + DerivedData önbelleği
      - name: SwiftPM + Pods + derleme önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/spm-cache
            ~/ship-derived
            ~/Library/Caches/CocoaPods
            app/**/Pods
          key: ios-${{ runner.os }}-${{ inputs.repo }}-${{ hashFiles('app/**/Package.resolved', 'app/**/Podfile.lock') }}-${{ github.run_id }}
          restore-keys: |
            ios-${{ runner.os }}-${{ inputs.repo }}-${{ hashFiles('app/**/Package.resolved', 'app/**/Podfile.lock') }}-
            ios-${{ runner.os }}-${{ inputs.repo }}-
      - name: Önbellek klasörlerini ayarla
        run: |
          echo "IOS_SPM_DIR=$HOME/spm-cache" >> "$GITHUB_ENV"
          echo "IOS_DERIVED_DIR=$HOME/ship-derived" >> "$GITHUB_ENV"

      - name: Prepare
        env:
          ENV_CONTENT: ${{ secrets[format('ENV_{0}', needs.detect.outputs.slug)] }}
        run: bash "$SHIPPER/scripts/prepare.sh" ios

      - name: Detect Xcode project
        run: bash "$SHIPPER/scripts/ios-detect.sh"

      - name: İmzala, derle ve TestFlight'a gönder
        working-directory: shipper
        env:
          ASC_KEY_ID: ${{ inputs.apple_profile != '' && secrets[format('ASC_KEY_ID_{0}', inputs.apple_profile)] || secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ inputs.apple_profile != '' && secrets[format('ASC_ISSUER_ID_{0}', inputs.apple_profile)] || secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ inputs.apple_profile != '' && secrets[format('ASC_PRIVATE_KEY_{0}', inputs.apple_profile)] || secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ inputs.apple_profile != '' && secrets[format('APPLE_TEAM_ID_{0}', inputs.apple_profile)] || secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ inputs.apple_profile != '' && secrets[format('IOS_DIST_CERT_P12_BASE64_{0}', inputs.apple_profile)] || secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ inputs.apple_profile != '' && secrets[format('IOS_DIST_CERT_PASSWORD_{0}', inputs.apple_profile)] || secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          export IOS_P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$IOS_P12_PATH"
          bundle exec fastlane ios ship
