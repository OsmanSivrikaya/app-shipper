name: Build macOS Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload macOS .dmg files to"
        required: true
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - name: Build macOS arm64 & x64 .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac
      - name: Upload macOS .dmg and .zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/
          gh release upload "${{ inputs.tag }}" dist/*.dmg dist/*-mac.zip --clobber
